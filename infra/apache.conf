ServerName localhost
LogLevel warn
ErrorLog "|/usr/local/bin/camagru-apache-log"
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    LimitRequestBody 25165824
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>
    CustomLog /dev/null common
    ErrorLog "|/usr/local/bin/camagru-apache-log"
</VirtualHost>
