name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install development tooling
        run: npm install --global pnpm@10.30.3 && pnpm install --frozen-lockfile
      - name: Syntax and dependency checks
        run: pnpm lint
      - name: Scan committed history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --no-banner
      - name: Configure local test environment
        run: php scripts/setup.php && docker compose config --quiet
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: PHP tests
        run: docker compose exec -T web php tests/php/run.php
      - name: Verify GIF with independent decoder
        run: |
          docker compose cp web:/tmp/camagru-test.gif /tmp/camagru-test.gif
          python3 -m venv /tmp/camagru-tools
          /tmp/camagru-tools/bin/pip install Pillow==12.1.0
          /tmp/camagru-tools/bin/python tests/tools/decode-gif.py /tmp/camagru-test.gif
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Browser tests
        run: pnpm test
      - name: Verify repeated startup and private storage
        run: |
          docker compose run --rm migrate
          docker compose exec -T web php tests/php/operations.php snapshot
          docker compose restart db
          docker compose up -d --wait
          docker compose restart web
          docker compose up -d --wait
          docker compose exec -T web php tests/php/operations.php verify
          curl --fail --silent http://localhost:8080/health
          docker compose exec -T web php tests/php/container.php
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: test-results/**/*.png
          retention-days: 3
      - name: Clean up
        if: always()
        run: docker compose down --volumes
